<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>homeport preview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0a1626">
  <div id="app">
    <main id="screen" style="max-width:1440px;margin:0 auto;padding:12px"></main>
  </div>
  <div id="modal-root"></div>
  <div id="sub-modal-root"></div>
  <script src="js/core/utils.js"></script>
  <script src="js/data/equipment.js"></script>
  <script src="js/data/ships.js"></script>
  <script src="js/data/maps.js"></script>
  <script src="js/data/history.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/data/live2d.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/game/battle.js"></script>
  <script src="js/game/factory.js"></script>
  <script src="js/game/improve.js"></script>
  <script src="js/game/logistics.js"></script>
  <script src="js/game/progression.js"></script>
  <script src="js/game/sortie.js"></script>
  <script src="js/ui/common.js"></script>
  <script src="js/ui/sortie.js"></script>
  <script src="js/ui/secretary-live2d.js"></script>
  <script src="js/ui/homeport.js"></script>
  <script>
    /* 母港人工核对页：秘书舰=第一舰队第一艘（fletcher），验证分层立绘渲染
     * 用法：npm start 后打开 http://127.0.0.1:3000/_shot_homeport.html */
    window.addEventListener('load', function () {
      Game.newGame();
      Game.gain({ fuel: 50000, ammo: 50000, steel: 50000, baux: 50000 });
      function mk(id, lv) {
        var s = Game.createShip(id, lv);
        s.hp = Game.shipStats(s.uid).hpMax;
        s.supply = { fuel: 1, ammo: 1 };
        Game.equipDefaults(s.uid);
        return s.uid;
      }
      Game.state.fleet[1] = [mk('fletcher', 80), mk('benson', 70), mk('iowa', 90)];
      Game.state.resources = Game.state.resources || {};
      UI.Screens.home(document.getElementById('screen'));
      /* ?talk=1  → 点一下秘书舰进入"说话"状态，验证张嘴差分
         ?eyes=1  → 常显闭眼差分，验证眨眼差分对位 */
      var q = new URLSearchParams(location.search);
      if (q.get('talk') === '1') {
        var f1 = document.querySelector('.sec-frame');
        if (f1) f1.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        setInterval(function () {
          var f = document.querySelector('.sec-frame');
          if (f) f.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        }, 1500);
      }
      if (q.get('eyes') === '1') {
        var st = document.querySelector('.l2d-stage');
        if (st) st.style.setProperty('--dx-eyes_closed', '1');
      }
    });
  </script>
</body>
</html>
