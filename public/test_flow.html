<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>UI Flow Test</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="result">RUNNING</div>
<header id="topbar"><div class="top-left"><span id="admiralInfo"></span></div><div id="resBar"></div></header>
<nav id="navbar"></nav>
<main id="screen"></main>
<div id="toast"></div>
<div id="modal-root"></div>
<div id="sub-modal-root"></div>
<script src="js/core/utils.js"></script>
<script src="js/data/equipment.js"></script>
<script src="js/data/ships.js"></script>
<script src="js/data/live2d.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/data/quests.js"></script>
<script src="js/core/state.js"></script>
<script src="js/game/battle.js"></script>
<script src="js/game/factory.js"></script>
<script src="js/game/improve.js"></script>
<script src="js/game/logistics.js"></script>
<script src="js/game/progression.js"></script>
<script src="js/game/sortie.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/secretary-live2d.js"></script>
<script src="js/ui/homeport.js"></script>
<script src="js/ui/dormitory.js"></script>
<script src="js/ui/sortie.js"></script>
<script src="js/ui/factory.js"></script>
<script src="js/ui/logistics.js"></script>
<script src="js/ui/quests.js"></script>
<script src="js/ui/library.js"></script>
<script>
  window.__errors = [];
  window.onerror = function (msg, src, line) { window.__errors.push(msg + ' @' + (src || '').split('/').pop() + ':' + line); };
  window.__results = [];
  const R = (ok, name, extra) => { window.__results.push((ok ? 'PASS' : 'FAIL') + ' ' + name + (extra ? ' :: ' + extra : '')); };

  function boot() {
    try {
      Game.load();
      Progression.initQuests();
      Progression.resetDue();

      /* 1. 屏幕渲染 */
      const screens = [['home'], ['formation'], ['factory'], ['logistics', 'expedition'], ['logistics', 'dock'], ['logistics', 'supply'], ['logistics', 'practice'], ['quests'], ['sortie']];
      for (const s of screens) {
        UI.go(s[0], s[1]);
        R(document.querySelector('#screen').innerHTML.length > 50, 'screen:' + s.join('/'));
      }
      /* P1批A：特殊节点与速力 */
      R(typeof shipSpeed === 'function' && shipSpeed(ShipData['newyork']) === 'slow' && shipSpeed(ShipData['iowa']) === 'fast', 'p1:speed');
      R(MAPS.find(m => m.id === '1-4').defs.B.mode === 'night', 'p1:night-node');
      R(MAPS.find(m => m.id === '2-2').defs.A.mode === 'sub' && MAPS.find(m => m.id === '2-2').defs.C.mode === 'sub', 'p1:sub-node');
      R(MAPS.find(m => m.id === '3-1').defs.W.type === 'whirlpool' && (MAPS.find(m => m.id === '3-1').defs.W.lossBase || 0) > 0, 'p1:whirlpool-node');
      R(['1-4','2-2','3-1'].every(id => (MAPS.find(m => m.id === id).brief || '').length > 20), 'p1:brief');

      /* 1.5 舰娘详情弹窗（母港点击舰艇 → 属性/立绘/装备槽；装备选择器为次级浮窗，关闭不影响详情页） */
      UI.go('home');
      const homeCards = document.querySelectorAll('#screen .ship-card');
      R(homeCards.length >= 2, 'shipdetail:cards', 'n=' + homeCards.length);
      const firstUid = homeCards[0].dataset.uid;
      homeCards[0].click();
      const dtlHtml = document.querySelector('#modal-root').innerHTML;
      R(dtlHtml.includes('耐久') && dtlHtml.includes('装备') && dtlHtml.includes('data-slot'), 'shipdetail:modal', dtlHtml.slice(0, 60));
      const dtlSlot = document.querySelector('#modal-root [data-slot]');
      if (dtlSlot) {
        dtlSlot.click();
        const pickerHtml = document.querySelector('#sub-modal-root').innerHTML;
        R(pickerHtml.includes('更换装备') && pickerHtml.includes('eq-cat-title'), 'shipdetail:equipPicker', pickerHtml.slice(0, 60));
        R(document.querySelector('#modal-root').innerHTML.includes('耐久'), 'shipdetail:detailStaysOpen');
        const pick = document.querySelector('#sub-modal-root [data-eq]');
        R(!!pick, 'shipdetail:pickable', pick && pick.textContent.slice(0, 20));
        if (pick) {
          const euid = pick.dataset.eq;
          pick.click();
          R(document.querySelector('#sub-modal-root').innerHTML === '', 'shipdetail:pickerClosed');
          R(document.querySelector('#modal-root').innerHTML.includes('耐久'), 'shipdetail:detailStillOpen');
          R(Game.state.ships[firstUid].equipped.includes(euid), 'shipdetail:equippedChanged');
          /* 刷新后的详情页 × 仍可关闭（回到主页） */
          const dtlClose = document.querySelector('#modal-root [data-close]');
          if (dtlClose) {
            dtlClose.click();
            R(document.querySelector('#modal-root').innerHTML === '', 'shipdetail:detailClosedByX');
          }
        }
      }
      document.querySelector('#modal-root').innerHTML = '';

      /* 2. 资源注入 + 强舰队 */
      Game.gain({ fuel: 20000, ammo: 20000, steel: 20000, baux: 20000 });
      const strongIds = ['enterprise', 'iowa', 'essex', 'fletcher', 'atlanta', 'saratoga'];
      const fleet = [];
      for (const id of strongIds) {
        const s = Game.createShip(id, 60);
        s.kai = 1;
        Game.equipDefaults(s.uid);
        s.supply = { fuel: 1, ammo: 1 };
        s.hp = Game.shipStats(s.uid).hpMax;
        fleet.push(s.uid);
      }
      Game.state.fleet[1] = fleet;
      Game.state.fleet[2] = [fleet.pop(), fleet.pop()];

      /* 3. 完整出击 1-1（血条=3次击破，循环最多 6 次：评价为 C/D 时不减血条，3 次不保证够，避免偶发假失败）
       * 每轮出击前必须补满油弹/耐久：1-1 每轮过 2 个战斗点 = 油耗弹耗各 40%，3 格血条要 3 次击破
       * → 3 轮正好消耗 120%，不补给则第 4 轮被「补给为零」拦下，任何一轮打出 C/D 就必然失败
       * （此前 145~153 项偶发挂 10 项就是这个原因）。这里复现的是玩家回港补给后再出击的真实流程。 */
      let cleared = false;
      for (let run = 0; run < 6 && !cleared; run++) {
        Logistics.supplyFleet(1);
        for (const u of Game.state.fleet[1]) Game.state.ships[u].hp = Game.shipStats(u).hpMax;
        const st1 = Sortie.start('1-1', 1);
        R(st1.ok, 'sortie:start', JSON.stringify(st1));
        let guard = 0, battles = 0, bossFought = false;
        while (Game.state.sortie && guard++ < 12) {
          const r = Sortie.advance('单纵阵', true);
          R(r.ok, 'sortie:advance-' + (r.type || '?'), JSON.stringify(r.msg));
          if (r.type === 'battle' || r.type === 'boss') {
            battles++;
            Progression.applyBattleResult(1, r.result, false);
            if (r.type === 'boss') { bossFought = true; if (r.cleared) cleared = true; }
            /* 战斗演出渲染冒烟测试 */
            UI.go('sortie');
            SortieUI.renderBattle(document.querySelector('#screen'), r, function () {});
            document.querySelector('#screen').innerHTML = '';
          }
          const nxt = Sortie.moveToNext();
          if (!nxt) break;
        }
        Sortie.returnHome();
        R(battles > 0, 'sortie:battles', 'count=' + battles);
        R(bossFought, 'sortie:bossFought');
      }
      R(cleared, 'sortie:1-1cleared');

      /* 4. 建造/开发/远征/入渠 UI 冒烟（直接逻辑） */
      const b = Factory.startBuild({ fuel: 400, ammo: 400, steel: 500, baux: 500 });
      R(b.ok, 'factory:build', JSON.stringify(b));
      Game.state.construction[0].end = Date.now() - 1;
      const cb = Factory.claimBuild(0);
      R(cb.ok, 'factory:claimBuild');
      /* 开发：即时结算（wiki：秘书舰系×资源池） */
      Game.state.admiral.level = 40;
      Game.state.resources.devMats = 10;
      const d = Factory.develop({ fuel: 20, ammo: 60, steel: 10, baux: 110 }, Game.state.fleet[1][0]);
      R(d.ok, 'factory:develop', JSON.stringify(d && { ok: d.ok, success: d.success, id: d.eq && d.eq.id }));
      R(Game.state.resources.devMats === 9 || Game.state.resources.devMats === 10, 'factory:devMats', 'devMats=' + Game.state.resources.devMats);
      R(Factory.developPreview({ fuel: 10, ammo: 251, steel: 250, baux: 10 }, null).pool === 'AMMO', 'devPool:ammo');
      const ex = Logistics.startExpedition(2, 'ex1');
      R(ex.ok, 'logistics:expedition', JSON.stringify(ex));
      Game.state.expeditions[2].end = Date.now() - 1;
      const cex = Logistics.claimExpedition(2);
      R(cex.ok, 'logistics:claimExpedition');
      const s0 = Game.state.ships[Game.state.fleet[1][0]];
      s0.hp = 1;
      const rc = Logistics.repairCost(s0.uid);
      const rr = Logistics.startRepair(0, s0.uid);
      R(rr.ok, 'logistics:repair', JSON.stringify(rr));
      Game.state.repairs[0].end = Date.now() - 1;
      Game.finishTimers(Date.now());
      R(Game.state.ships[s0.uid].hp > 1, 'logistics:repairDone', 'hp=' + Game.state.ships[s0.uid].hp);

      /* 5. 演习 */
      const pr = Logistics.practiceReady();
      const res = Battle.battle(Game.state.fleet[1], pr.fleets[0].ships, '单纵阵', '单纵阵', { allowNight: true, fleetIdx: 1 });
      R(typeof res.rank === 'string' && res.rank.length === 1, 'practice:battle', res.rank);
      Progression.applyBattleResult(1, res, true);

      /* 6. 任务 */
      Progression.notify('sortie', 3);
      const cq = Progression.claimQuest('d1');
      R(cq.ok, 'quest:claim', JSON.stringify(cq.q && cq.q.id));

      /* 7. 改造 */
      s0.lv = 90;
      const rm = Progression.remodel(s0.uid);
      R(rm.ok, 'remodel:kai2', JSON.stringify(rm));

      /* 8. 改修工厂 + 近代化（冒烟） */
      Game.state.improve.count = 0;
      const vestal = Game.createShip('vestal', 1);
      Game.state.fleet[1].unshift(vestal.uid);
      R(Improve.secretaryIsVestal(), 'improve:unlock');
      Game.state.resources.screws = 50;
      const eqI = Game.createEquip('gun5in_30');
      const ri = Improve.improve(eqI.uid, false);
      R(ri.ok && ri.success && eqI.star === 1, 'improve:run', JSON.stringify(ri));
      R(Game.state.resources.screws === 49, 'improve:screwsCost', 'screws=' + Game.state.resources.screws);
      UI.go('factory', 'improve');
      R(document.querySelector('#screen').innerHTML.includes('改修工厂') && document.querySelector('#screen').innerHTML.includes('5inch单装炮'), 'screen:improve');
      const tgt = Game.createShip('mahan', 1);
      const matP = Game.createShip('mahan', 1);
      const pvM = Progression.modernizePreview(tgt.uid, [matP.uid]);
      R(pvM.ok && pvM.shown.fp === 1, 'modernize:preview', JSON.stringify(pvM));
      const rmM = Progression.modernize(tgt.uid, [Game.createShip('benson', 1).uid]);
      R(rmM.ok, 'modernize:synthesize', JSON.stringify(rmM));
      /* 顶部一级菜单 + 工厂近代化改修页签 */
      R(document.querySelectorAll('#navbar button').length === 11, 'nav:topmenu', 'n=' + document.querySelectorAll('#navbar button').length);
      UI.go('factory', 'modernize');
      R(document.querySelector('#screen').innerHTML.includes('近代化改修') && document.querySelector('#screen').innerHTML.includes('剩余可改修'), 'screen:factory-modernize');
      document.querySelector('#screen').querySelector('[data-mod-target]').click();
      R(document.querySelector('#modal-root').innerHTML.includes('选择素材舰'), 'modernize:modalFromFactory');
      /* 装备开发面板（开发池预览）+ 装备仓库（解体）冒烟 */
      UI.go('factory', 'dev');
      const devHtml = document.querySelector('#screen').innerHTML;
      R(devHtml.includes('装备开发') && devHtml.includes('开发资材') && devHtml.includes('当前开发池'), 'screen:factory-dev');
      R(devHtml.includes('开发失败'), 'screen:dev-fail-share');
      R(devHtml.includes('10连开发'), 'screen:dev10-button');
      const dev10Btn = document.querySelector('#screen [data-act="dev10"]');
      if (dev10Btn) {
        dev10Btn.click();
        R(document.querySelector('#modal-root').innerHTML.includes('10连开发结果'), 'factory:dev10-modal');
      document.querySelector('#modal-root').innerHTML = '';

      /* 1.6 第三第四舰队 UI：编成4页签 + 锁定态 + 远征/出击页签只显示已解锁舰队 */
      UI.go('formation');
      const formHtml = document.querySelector('#screen').innerHTML;
      R(formHtml.includes('第三舰队') && formHtml.includes('第四舰队'), 'formation:4fleetTabs');
      R(formHtml.includes('🔒'), 'formation:lockedTabsShown');
      UI.go('formation', 3);
      R(document.querySelector('#screen').innerHTML.includes('尚未解锁'), 'formation:lockedTabBody');
      UI.go('formation', 2);
      R(document.querySelector('#screen').innerHTML.includes('第二舰队'), 'formation:fleet2Tab');
      UI.go('logistics', 'expedition');
      const exTabs = document.querySelectorAll('#screen [data-exf]').length;
      R(exTabs === 1, 'logistics:exFleetTabsOnlyUnlocked', 'n=' + exTabs);
      UI.go('sortie');
      const sTabs = document.querySelectorAll('#screen [data-fleet]').length;
      R(sTabs === 2, 'sortie:fleetTabsOnlyUnlocked', 'n=' + sTabs);

      }
      UI.go('factory', 'equip');
      const eqpHtml = document.querySelector('#screen').innerHTML;
      R(eqpHtml.includes('装备仓库') && eqpHtml.includes('库存'), 'screen:factory-equip');
      const spare = Object.keys(Game.state.equipment).find(eu => !Object.values(Game.state.ships).some(s => (s.equipped || []).includes(eu)));
      const scrapR = Factory.scrapEquip(spare);
      R(scrapR.ok && !Game.state.equipment[spare], 'factory:scrapEquip', JSON.stringify(scrapR.gain));

      /* 9. 舰艇宿舍：总览/筛选/排序/详情 */
      UI.go('dormitory');
      let dorHtml = document.querySelector('#screen').innerHTML;
      R(dorHtml.includes('舰艇宿舍') && dorHtml.includes('dorm-grid'), 'dormitory:screen');
      const dorCards = document.querySelectorAll('#screen .dorm-grid .ship-card');
      R(dorCards.length >= 4, 'dormitory:cards', 'n=' + dorCards.length);
      R(dorHtml.includes('稀有度') && dorHtml.includes('舰队') && dorHtml.includes('排序'), 'dormitory:tools');
      /* 稀有度筛选：只显示★5 金色舰娘 */
      document.querySelector('#screen [data-drarity="5"]').click();
      const expR5 = Object.values(Game.state.ships).filter(s => (Game.shipDef(s).rarity || 1) === 5).length;
      const goldCards = document.querySelectorAll('#screen .dorm-grid .ship-card');
      R(goldCards.length === expR5 && expR5 > 0, 'dormitory:rarityFilter', 'n=' + goldCards.length + ' exp=' + expR5);
      /* 舰队筛选：第1队 */
      document.querySelector('#screen [data-drarity="0"]').click();
      document.querySelector('#screen [data-dfleet="1"]').click();
      const expF1 = Object.values(Game.state.ships).filter(s => Game.state.fleet[1].includes(s.uid)).length;
      const f1Cards = document.querySelectorAll('#screen .dorm-grid .ship-card');
      R(f1Cards.length === expF1, 'dormitory:fleetFilter', 'n=' + f1Cards.length + ' exp=' + expF1);
      /* 未编队筛选 */
      document.querySelector('#screen [data-dfleet="-1"]').click();
      const expIdle = Object.values(Game.state.ships).filter(s => ![1, 2, 3, 4].some(f => Game.state.fleet[f].includes(s.uid))).length;
      const idleCards = document.querySelectorAll('#screen .dorm-grid .ship-card');
      R(idleCards.length === expIdle, 'dormitory:idleFilter', 'n=' + idleCards.length + ' exp=' + expIdle);
      /* 舰种筛选：驱逐舰 */
      document.querySelector('#screen [data-dfleet="0"]').click();
      document.querySelector('#screen [data-drarity="0"]').click();
      document.querySelector('#screen [data-dtype="DD"]').click();
      const ddCards = document.querySelectorAll('#screen .dorm-grid .ship-card');
      R(ddCards.length >= 1 && [...ddCards].every(c => Game.shipDef(Game.state.ships[c.dataset.uid]).type === 'DD'), 'dormitory:typeFilter', 'n=' + ddCards.length);
      /* 排序：等级 低→高（首卡等级应最低） */
      document.querySelector('#screen [data-dtype="ALL"]').click();
      document.querySelector('#screen [data-dsort="lv:1"]').click();
      const sortedCards = document.querySelectorAll('#screen .dorm-grid .ship-card');
      const firstLv = Game.state.ships[sortedCards[0].dataset.uid].lv;
      const minLv = Math.min(...[...sortedCards].map(c => Game.state.ships[c.dataset.uid].lv));
      R(firstLv === minLv, 'dormitory:sortLvAsc', 'first=' + firstLv + ' min=' + minLv);
      /* 点击舰娘图标 → 详情弹窗 */
      document.querySelector('#screen .dorm-grid .ship-card').click();
      R(document.querySelector('#modal-root').innerHTML.includes('耐久') && document.querySelector('#modal-root').innerHTML.includes('装备'), 'dormitory:detailModal');
      document.querySelector('#modal-root').innerHTML = '';

      /* 图鉴：收集率统计、已获得登录、未获得占位、装备页签 */
      UI.go('library');
      const libHtml = document.querySelector('#screen').innerHTML;
      R(libHtml.includes('图鉴') && libHtml.includes('已登录'), 'library:render');
      const libStats = Game.libraryStats();
      R(libStats.ships.total > 0 && libStats.ships.owned > 0, 'library:stats', JSON.stringify(libStats.ships));
      R(libStats.ships.owned <= libStats.ships.total, 'library:statsSane');
      const libCards = document.querySelectorAll('#screen .lib-card');
      R(libCards.length === libStats.ships.total, 'library:cardCount', 'n=' + libCards.length);
      R(document.querySelectorAll('#screen .lib-card.locked').length > 0, 'library:lockedCards');
      R(Game.libraryHasShip(libStats.shipIds[0]), 'library:hasShipApi');
      document.querySelector('#screen [data-tab="equips"]').click();
      R(document.querySelector('#screen').innerHTML.includes('全部类别'), 'library:equipTab');
      const eqCards = document.querySelectorAll('#screen .lib-card');
      R(eqCards.length === libStats.equips.total, 'library:equipCardCount', 'n=' + eqCards.length);
      /* 只看已获得 */
      const onlyBox = document.querySelector('#screen [data-fowned]');
      onlyBox.checked = true;
      onlyBox.dispatchEvent(new Event('change'));
      R(document.querySelectorAll('#screen .lib-card.locked').length === 0, 'library:onlyOwned');

      /* ===== 方向一：出击前情报室 ===== */
      R(typeof Sortie.intel === 'function' && Sortie.intel(1, '2-2') !== null, 'intel:engineApi');
      R(Sortie.intel(1, '1-2').threats.length === 2 && Sortie.intel(1, '3-1').threats.length === 3, 'intel:threatCount');
      R(Sortie.intel(1, '1-1').threats.length === 0, 'intel:noThreatMap');
      R(Sortie.intel(1, '2-2').specials.day.length === 5 && Sortie.intel(1, '2-2').specials.night.length === 3, 'intel:specialCount');
      R(Game.fleetAir(1) === Battle.airPower(Game.battleFleetStats(1).ships), 'intel:fleetAirSameSource');
      UI.go('sortie');
      document.querySelector('#screen [data-area="3"]').click();
      document.querySelector('#screen [data-map="3-1"]').click();
      const iHtml = document.querySelector('#screen').innerHTML;
      R(iHtml.includes('舰队能力') && iHtml.includes('制空') && iHtml.includes('夜战火力'), 'intel:panelAbilities');
      R(iHtml.includes('威胁对位') && iHtml.includes('电探·燃料'), 'intel:panelThreats');
      R(iHtml.includes('特殊攻击') && (iHtml.indexOf('✓') >= 0 || iHtml.indexOf('✗') >= 0), 'intel:panelSpecials');
      R(iHtml.includes('威胁评估') && iHtml.includes('异常洋流'), 'intel:threatNote');
      const startBtn = document.querySelector('#screen [data-start]');
      R(!!startBtn && !startBtn.disabled, 'intel:notBlocking');
      /* 未声明威胁维度的海域：不显示「威胁对位」区块，但仍显示舰队能力 */
      document.querySelector('#screen [data-area="1"]').click();
      document.querySelector('#screen [data-map="1-1"]').click();
      const iHtml2 = document.querySelector('#screen').innerHTML;
      R(!iHtml2.includes('威胁对位') && iHtml2.includes('舰队能力'), 'intel:noThreatBlock');

      /* ===== 海域选择页布局 =====
       * 事故：右列详情文案变长 → 左列地图被拉伸变形（2-1 正常、2-2 被拉长）。
       * 根因是 flex 行 align-items:stretch + 地图无固定高度。以下断言守住修复。
       * 作战简报（原在右列内）改为地图下方的独立框。 */
      const goArea = (a, mid) => {
        document.querySelector('#screen [data-area="' + a + '"]').click();
        document.querySelector('#screen [data-map="' + mid + '"]').click();
      };
      const rectOf = sel => document.querySelector('#screen ' + sel).getBoundingClientRect();
      const aspect = r => r.width / r.height;
      goArea('1', '1-1');
      const box11 = rectOf('.area-map');
      goArea('2', '2-2');
      const box22 = rectOf('.area-map');
      /* 地图高度必须只由「自身宽度 × 5/4」决定，与右列详情文本长度无关。
       * 修复前：1-1 ≈ 743px、2-2 ≈ 946px（右列文案变长 → 地图被纵向拉伸）。 */
      R(Math.abs(aspect(box11) - aspect(box22)) <= 0.02, 'layout:mapNotStretched',
        '1-1 ' + Math.round(box11.width) + 'x' + Math.round(box11.height)
        + ' / 2-2 ' + Math.round(box22.width) + 'x' + Math.round(box22.height));
      R(Math.abs(aspect(box22) - 5 / 4) <= 0.05, 'layout:mapAspectRatio',
        'aspect=' + aspect(box22).toFixed(3));
      R(rectOf('.map-detail').left > rectOf('.area-map').right, 'layout:detailRightOfMap');
      R(Math.abs(box22.top - rectOf('.map-detail').top) <= 1, 'layout:columnsTopAligned');
      const briefEl = document.querySelector('#screen .sortie-brief');
      R(!!briefEl && !!document.querySelector('#screen .sortie-mapside > .sortie-brief'), 'layout:briefBelowMap');
      R(!!briefEl && !document.querySelector('#screen .map-detail .sortie-brief'), 'layout:briefNotInDetailColumn');
      R(briefEl.getBoundingClientRect().top >= box22.bottom - 1, 'layout:briefAfterMap');
      goArea('1', '1-1');
      R(!document.querySelector('#screen .sortie-brief'), 'layout:noBriefBoxWhenMapHasNone');
      /* 失败归因（制空/索敌）与防误报 */
      const attrBad = Sortie.attributionLines({ result: { victory: false, rank: 'D', myAir: 100, enAir: 400, airSup: false, recon: false }, nodeDef: { type: 'battle' }, fleet: Game.state.fleet[1], st: Game.state });
      const attrOk = Sortie.attributionLines({ result: { victory: false, rank: 'D', myAir: 400, enAir: 100, airSup: true, recon: true }, nodeDef: { type: 'battle' }, fleet: Game.state.fleet[1], st: Game.state });
      R(attrBad.some(l => l.includes('制空')) && attrBad.some(l => l.includes('索敌')), 'intel:attribution');
      R(!attrOk.some(l => l.includes('制空') || l.includes('索敌')), 'intel:attributionNoFalse');

      /* ===== 方向三：士气可见化 ===== */
      R(typeof Battle.moraleTier === 'function' && Battle.moraleTier(60).key === 'flash' && Battle.moraleTier(29).key === 'red'
        && Battle.moraleTier(30).key === 'low' && Battle.moraleTier(45).key === 'normal', 'morale:tierBoundary');
      R(Game.moraleBadge(60).includes('1.2') && Game.moraleBadge(60).includes('1.8')
        && Game.moraleBadge(20).includes('0.5') && Game.moraleBadge(45) === '' && Game.moraleBadge(35) === '偏低', 'morale:badgeText');
      const mUid = Game.state.fleet[1][0];
      /* 先归零：前面的出击已把士气打到偏低/红脸，这里要构造确定的档位分布 */
      for (const u of Game.state.fleet[1]) Game.state.ships[u].morale = 55;
      Game.state.ships[mUid].morale = 20;
      Game.state.ships[Game.state.fleet[1][1] || mUid].morale = 35;
      UI.go('formation', 1);
      const fHtml = document.querySelector('#screen').innerHTML;
      R(fHtml.includes('士气 平均') && fHtml.includes('红脸 1') && fHtml.includes('偏低 1'), 'morale:formationSummary');
      R(fHtml.includes('md-morale') && /轮换|休整/.test(fHtml), 'morale:formationAdvice');
      R(document.querySelector('#screen .state-badge.morale-red') !== null, 'morale:formationBadge');
      UI.go('home');
      const hHtml = document.querySelector('#screen').innerHTML;
      R(hHtml.includes('舰队士气'), 'morale:homeStat');
      R(document.querySelector('#screen .state-badge.morale-red') !== null, 'morale:homeBadge');
      UI.go('sortie');
      document.querySelector('#screen [data-area="2"]').click();
      document.querySelector('#screen [data-map="2-2"]').click();
      const sMHtml = document.querySelector('#screen').innerHTML;
      R(sMHtml.includes('舰队士气'), 'morale:sortieRow');
      R(/轮换|休整/.test(sMHtml), 'morale:sortieAdvice');
      const mStart = document.querySelector('#screen [data-start]');
      R(!!mStart && !mStart.disabled, 'morale:notBlocking');
      const mAttr = Sortie.attributionLines({ result: { victory: false, rank: 'D', myAir: 0, enAir: 0, airSup: false, recon: true }, nodeDef: { type: 'battle' }, fleet: Game.state.fleet[1], st: Game.state });
      R(mAttr.some(l => l.includes('红脸')), 'morale:attribution');
      Game.state.ships[mUid].morale = 49;

      /* ===== 方向五：侦察引导航向 ===== */
      R(JSON.stringify(Battle.engagementWeights(true, false)) === JSON.stringify(Battle.ENG_WEIGHTS.base), 'recon:backwardCompat');
      R(JSON.stringify(Battle.engagementWeights(false, true)) === JSON.stringify(Battle.ENG_WEIGHTS.base), 'recon:reconFailGate');
      R(JSON.stringify(Battle.engagementWeights(true, true)) === JSON.stringify(Battle.ENG_WEIGHTS.recon), 'recon:active');
      R(Battle.ENG_WEIGHTS.base.T_DIS === 10 && Battle.ENG_WEIGHTS.recon.T_DIS === 5 && Battle.ENG_WEIGHTS.recon.T_DIS > 0, 'recon:weightTable');
      R(!!Sortie.intel(1, '3-1').reconGuide && typeof Sortie.intel(1, '3-1').reconGuide.carried === 'boolean', 'recon:intelApi');
      R(document.querySelector('#screen').innerHTML.includes('航向侦察'), 'recon:panel');

      /* ===== 方向二：舰历 ===== */
      R(typeof Progression.recordSummary === 'function' && Progression.HONORS.length >= 6 && Progression.HONORS.length <= 8, 'record:honorCount');
      /* 取一艘真正打过仗的舰（前面的流程会 unshift 维斯塔尔，fleet[1][0] 未必参战过） */
      const rUid = Object.keys(Game.state.ships).find(u => Game.state.ships[u].record && Game.state.ships[u].record.sorties > 0) || Game.state.fleet[1][0];
      const rSum = Progression.recordSummary(rUid);
      R(!!rSum && rSum.sorties > 0 && !JSON.stringify(rSum).includes('undefined'), 'record:summary', JSON.stringify(rSum && rSum.sorties));
      R(Array.isArray(rSum.honors) && rSum.honors.length <= Progression.HONORS.length, 'record:honorsBound');
      /* 详情弹窗：属性页签 → 舰历页签 → 履历摘要/荣誉墙/舰史 都渲染，且无 undefined
         注意：不调用 UI.go('home')——每次进入母港都会启动一套秘书舰 rAF 循环，
         叠加后会让 headless 的虚拟时间预算吃紧（用 openShipDetail 直接开弹窗即可） */
      Homeport.openShipDetail(rUid);
      const dtl1 = document.querySelector('#modal-root').innerHTML;
      R(dtl1.includes('属性与装备') && dtl1.includes('data-dtab="record"'), 'record:tabBar');
      document.querySelector('#modal-root [data-dtab="record"]').click();
      const dtl2 = document.querySelector('#modal-root').innerHTML;
      R(dtl2.includes('履历') && dtl2.includes('荣誉墙') && dtl2.includes('舰史'), 'record:recordPane');
      R(!dtl2.includes('undefined'), 'record:noUndefined');
      R(document.querySelectorAll('#modal-root .honor').length === Progression.HONORS.length, 'record:honorWall',
        'n=' + document.querySelectorAll('#modal-root .honor').length);
      R(document.querySelectorAll('#modal-root .rec-item').length === 8, 'record:recGrid');
      /* 回到属性页签后操作按钮仍在（页签切换不破坏弹窗） */
      document.querySelector('#modal-root [data-dtab="stat"]').click();
      R(document.querySelector('#modal-root [data-act="supply"]') !== null, 'record:backToStat');
      document.querySelector('#modal-root').innerHTML = '';
      /* 无履历的新舰也必须能正常打开舰历（不报错、不出现 undefined） */
      const freshUid = Game.createShip('benson', 1).uid;
      Homeport.openShipDetail(freshUid);
      document.querySelector('#modal-root [data-dtab="record"]').click();
      const dtl3 = document.querySelector('#modal-root').innerHTML;
      R(dtl3.includes('荣誉墙') && !dtl3.includes('undefined'), 'record:freshShip');
      document.querySelector('#modal-root').innerHTML = '';

      /* ===== 方向四：海域作战目标 ===== */
      R(typeof Sortie.checkObjectives === 'function' && typeof Sortie.objectivePreview === 'function' && typeof Progression.grantObjectiveRewards === 'function', 'obj:api');
      const objMaps = MAPS.filter(m => (m.objectives || []).length);
      let objTotal = 0;
      for (const m of objMaps) objTotal += m.objectives.length;
      R(objMaps.length >= 6 && objMaps.length <= 8, 'obj:mapCount', 'n=' + objMaps.length);
      R(objTotal <= 15, 'obj:totalCap', 'n=' + objTotal);
      R(objMaps.every(m => m.objectives.every(o => o.reward && ['sRank', 'noHeavy', 'typeLimit'].includes(o.type))), 'obj:shape');
      R(Sortie.checkObjectives(MAPS.find(m => m.id === '2-2'), { nodeDef: { type: 'boss' }, result: { rank: 'S', myDaPo: 0 }, daPoSeen: false, fleetTypes: ['DD', 'DD', 'DD'] }).every(o => o.ok), 'obj:checkApi');
      UI.go('sortie');
      document.querySelector('#screen [data-area="3"]').click();
      document.querySelector('#screen [data-map="3-1"]').click();
      const oHtml = document.querySelector('#screen').innerHTML;
      R(oHtml.includes('作战目标') && oHtml.includes('战功'), 'obj:panel');
      R(oHtml.includes('编成含 ≥2 艘战列舰'), 'obj:condText');
      R(oHtml.includes('战斗中达成'), 'obj:battleOnlyTag');
      R(/当前 \d+ 艘/.test(oHtml), 'obj:preCount');
      R(oHtml.includes('一次性'), 'obj:oneTimeTag');
      R(!document.querySelector('#screen [data-start]').disabled, 'obj:notBlocking');
      UI.go('library');
      R(document.querySelector('#screen').innerHTML.includes('战功'), 'obj:libraryWarRecord');

      /* ===== 批次1：航空战点（mode:'air'）——进点横幅的三种边界 =====
       * 断言的是「真实渲染出来的 DOM」，不是函数返回值：横幅必须出现在节点页上，
       * 且无航母 / 有航母两种编成拿到不同的文案（坑 #12 的防误报）。 */
      Sortie.returnHome();
      UI.go('sortie');
      const mkAirShip = (id, lv, eqs) => {
        const sh = Game.createShip(id, lv);
        sh.equipped = eqs.map(x => Game.createEquip(x).uid);
        sh.hp = Game.shipStats(sh.uid).hpMax;
        return sh.uid;
      };
      const airNoCvFleet = [mkAirShip('benson', 60, ['gun5in_38']), mkAirShip('mahan', 60, ['gun5in_38'])];
      Game.state.fleet[2] = airNoCvFleet.slice();
      const srtAir1 = Sortie.start('2-3', 2);
      R(srtAir1.ok === true, 'air:startWithoutCV', JSON.stringify(srtAir1));
      Game.state.sortie.node = 'A';                 // 2-3 A = 航空战点
      UI.go('sortie');
      const airBanner1 = document.querySelector('#screen .map-banner');
      R(!!airBanner1 && airBanner1.textContent.indexOf('舰队没有航空母舰') >= 0, 'air:bannerNoCV',
        airBanner1 ? airBanner1.textContent : '(无横幅元素)');
      R(document.querySelector('#screen').innerHTML.indexOf('航空战点') >= 0, 'air:nodeTypeLabel');
      R(document.querySelector('#screen .map-node.mode-air') !== null, 'air:mapNodeIcon');
      /* 回归：夜战/潜艇节点的专属图标、配色与进点横幅仍在（1-4 B=night、2-2 A=sub） */
      Sortie.returnHome();
      const srtNight = Sortie.start('1-4', 2);
      if (srtNight.ok) {
        Game.state.sortie.node = 'B';            // 1-4 B = 夜战点
        UI.go('sortie');
        R(document.querySelector('#screen .map-node.mode-night') !== null, 'air:nightNodeIcon');
        const nb = document.querySelector('#screen .map-banner');
        R(!!nb && nb.textContent.indexOf('照明弹') >= 0, 'air:nightBanner', nb ? nb.textContent : '(无)');
        Sortie.returnHome();
      }
      const srtSub = Sortie.start('2-2', 2);
      if (srtSub.ok) {
        Game.state.sortie.node = 'A';            // 2-2 A = 潜艇点
        UI.go('sortie');
        R(document.querySelector('#screen .map-node.mode-sub') !== null, 'air:subNodeIcon');
        const sb = document.querySelector('#screen .map-banner');
        R(!!sb && sb.textContent.indexOf('声呐') >= 0, 'air:subBanner', sb ? sb.textContent : '(无)');
        Sortie.returnHome();
      }
      Sortie.returnHome();
      const airCvUid = mkAirShip('enterprise', 60, ['f6f5', 'f6f5', 'f6f5', 'f6f5']);
      Game.state.fleet[2] = [airCvUid].concat(airNoCvFleet);
      const srtAir2 = Sortie.start('2-3', 2);
      R(srtAir2.ok === true, 'air:startWithCV', JSON.stringify(srtAir2));
      Game.state.sortie.node = 'A';
      UI.go('sortie');
      const airBanner2 = document.querySelector('#screen .map-banner');
      R(!!airBanner2 && airBanner2.textContent.indexOf('航母之间的战斗') >= 0, 'air:bannerWithCV',
        airBanner2 ? airBanner2.textContent : '(无横幅元素)');
      /* 三处文案（简报 / 横幅 / 归因）与机制同批：简报在 2-3 海域详情里 */
      Sortie.returnHome();
      UI.go('sortie');
      document.querySelector('#screen [data-area="2"]').click();
      document.querySelector('#screen [data-map="2-3"]').click();
      const b23 = document.querySelector('#screen').innerHTML;
      R(b23.indexOf('航空战') >= 0 && b23.indexOf('编入航母并搭载舰战') >= 0, 'air:briefVisible');
      R(b23.indexOf('航空战点') >= 0, 'air:threatRow');
      UI.go('sortie');

      document.querySelector('#result').textContent = JSON.stringify({ errors: window.__errors, results: window.__results });
    } catch (e) {
      window.__errors.push('FATAL ' + e.message + ' ' + (e.stack || '').split('\n')[1]);
      document.querySelector('#result').textContent = JSON.stringify({ errors: window.__errors, results: window.__results });
    }
  }
  setTimeout(boot, 300);
</script>
</body>
</html>
