<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>air node preview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#0a1626">
  <div id="app">
    <main id="screen" style="max-width:1440px;margin:0 auto;padding:12px"></main>
  </div>
  <div id="modal-root"></div>
  <div id="sub-modal-root"></div>
  <script src="js/core/utils.js"></script>
  <script src="js/data/equipment.js"></script>
  <script src="js/data/ships.js"></script>
  <script src="js/data/maps.js"></script>
  <script src="js/data/history.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/game/battle.js"></script>
  <script src="js/game/factory.js"></script>
  <script src="js/game/improve.js"></script>
  <script src="js/game/logistics.js"></script>
  <script src="js/game/progression.js"></script>
  <script src="js/game/sortie.js"></script>
  <script src="js/ui/common.js"></script>
  <script src="js/ui/sortie.js"></script>
  <script>
    /* 航空战点（2-3 A）人工核对页：?case=noCV 无航母 / withCV 带舰战航母 / brief 海域简报
     * 其它 case：touch 触接 / brief15 1-5 / brief21 2-1（简报补全回归）/ brief35 3-5 / brief44 4-4 / nodes35 3-5 节点
     * 用法：npm start 后打开 http://127.0.0.1:3000/_shot_air.html?case=noCV */
    window.addEventListener('load', function () {
      var q = new URLSearchParams(location.search);
      var c = q.get('case') || 'noCV';
      Game.newGame();
      Game.gain({ fuel: 50000, ammo: 50000, steel: 50000, baux: 50000 });
      var scr = document.getElementById('screen');

      function mk(id, lv, eqs) {
        var s = Game.createShip(id, lv);
        s.hp = Game.shipStats(s.uid).hpMax;
        s.supply = { fuel: 1, ammo: 1 };
        if (eqs) {
          s.equipped = eqs.map(function (e) { return Game.createEquip(e).uid; });
        } else { Game.equipDefaults(s.uid); }
        return s.uid;
      }
      var escorts = [mk('iowa', 90, ['gun16in_50', 'gun16in_50', 'ap_mk8', 'os2u']),
                     mk('fletcher', 80, ['gun5in_38', 'torp_mk15', 'torp_mk15']),
                     mk('benson', 70, ['gun5in_38', 'torp_mk15'])];
      var fleet = c === 'withCV'
        ? [mk('enterprise', 95, ['f6f5', 'f6f5', 'f6f5', 'sbdvs2'])].concat(escorts)
        : (c === 'touch'
          ? [mk('enterprise', 95, ['f6f5', 'f6f5', 'tbf', 'sbdvs2']),
             mk('essex', 90, ['f6f5', 'f6f5', 'tbf', 'soc'])].concat(escorts)
          : escorts.slice());
      Game.state.fleet[1] = fleet;
      /* 制造部分攻略进度，便于看地图状态 */
      Game.state.mapProgress['1-1'].cleared = true; Game.state.mapProgress['1-1'].gauge = 0; Game.state.mapProgress['1-1'].kills = 3;
      Game.state.mapProgress['1-2'].cleared = true; Game.state.mapProgress['1-2'].gauge = 0; Game.state.mapProgress['1-2'].kills = 4;
      Game.state.mapProgress['2-3'].kills = 2; Game.state.mapProgress['2-3'].gauge = 3;

      if (c === 'brief' || c === 'touch') {
        SortieUI.mapList(scr);
        /* 直接选中 2-3 展示海域详情（含作战简报 + 威胁评估 + 编成自检） */
        var a2 = scr.querySelector('[data-area="2"]'); if (a2) a2.click();
        var m23 = scr.querySelector('[data-map="2-3"]'); if (m23) m23.click();
        return;
      }
      if (c === 'nodes35') {
        /* 3-5 全类型混合节点（毕业考）：B 夜战 / D 航空战 / G 潜艇 / W 漩涡 */
        Game.state.mapProgress['3-4'].cleared = true;
        Game.state.mapProgress['3-5'].kills = 3; Game.state.mapProgress['3-5'].gauge = 4;
        var st35 = Sortie.start('3-5', 1);
        if (!st35.ok) { scr.innerHTML = '<pre style="color:#f88">' + st35.msg + '</pre>'; return; }
        Game.state.sortie.node = 'B';
        SortieUI.sortieActive(scr);
        return;
      }
      if (c === 'brief35') {
        SortieUI.mapList(scr);
        var a3 = scr.querySelector('[data-area="3"]'); if (a3) a3.click();
        var m35 = scr.querySelector('[data-map="3-5"]'); if (m35) m35.click();
        return;
      }
      if (c === 'brief44') {
        /* 4-4 菲律宾海决战：全空袭决战（批次4.1 新声明威胁维度） */
        SortieUI.mapList(scr);
        var a4 = scr.querySelector('[data-area="4"]'); if (a4) a4.click();
        var m44 = scr.querySelector('[data-map="4-4"]'); if (m44) m44.click();
        return;
      }
      if (c === 'brief15') {
        /* 1-5 夏威夷近海哨戒：作战简报夹在「BOSS掉落」与「出击按钮」之间（用户指定的最终位置） */
        Game.state.mapProgress['1-4'].cleared = true;   // 解锁 1-5，让出击按钮可见
        SortieUI.mapList(scr);
        var a1 = scr.querySelector('[data-area="1"]'); if (a1) a1.click();
        var m15 = scr.querySelector('[data-map="1-5"]'); if (m15) m15.click();
        return;
      }
      if (c === 'brief21') {
        /* 2-1 图拉吉急袭：用户报「没有任务简报」的那一张 —— 本图无特殊节点，
         * 但设计稿 §5 要求「每海域」都有 brief（回归见 scripts/simulate.js 简报覆盖率断言） */
        SortieUI.mapList(scr);
        var a2b = scr.querySelector('[data-area="2"]'); if (a2b) a2b.click();
        var m21 = scr.querySelector('[data-map="2-1"]'); if (m21) m21.click();
        return;
      }
      if (c === 'hist' || c === 'histH2' || c === 'histHard') {
        /* 历史战役页签（V0.303）：
         *   hist     —— 战役列表 + H1 详情 + 史实匹配度自检（史实编成：双航母）
         *   histH2   —— H2 铁底湾 + 含战列舰编成 → 禁入舰种红色警示 + 强敌阶锁定态
         *   histHard —— 提督 Lv.20（常规阶可出击、但尚未首通）→ 强敌阶锁定态显示解锁条件 */
        Game.state.admiral.level = (c === 'histHard') ? 20 : 60;
        var histFleet = (c === 'histH2')
          ? [mk('iowa', 90, ['gun16in_50', 'gun16in_50', 'ap_mk8']),
             mk('fletcher', 80, ['gun5in_38', 'torp_mk15', 'torp_mk15']),
             mk('benson', 75, ['gun5in_38', 'torp_mk15'])]
          : [mk('enterprise', 95, ['f6f5', 'f6f5', 'f6f5', 'sbdvs2']),
             mk('essex', 90, ['f6f5', 'f6f5', 'tbf', 'sbdvs2']),
             mk('iowa', 90, ['gun16in_50', 'gun16in_50', 'ap_mk8']),
             mk('fletcher', 80, ['gun5in_38', 'torp_mk15', 'torp_mk15'])];
        Game.state.fleet[1] = histFleet;
        SortieUI.mapList(scr);
        var tabH = scr.querySelector('[data-tab="hist"]'); if (tabH) tabH.click();
        if (c === 'histH2') { var b2 = scr.querySelector('[data-battle="H2"]'); if (b2) b2.click(); }
        return;
      }
      if (c === 'histWave') {
        /* 强敌阶第二波入场（V0.303）：H1 强敌阶，强制推进到 BOSS 第二波，看独立横幅 */
        Game.state.admiral.level = 60;
        Game.state.fleet[1] = [mk('enterprise', 95, ['f6f5', 'f6f5', 'f6f5', 'sbdvs2']),
                               mk('essex', 90, ['f6f5', 'f6f5', 'sbdvs2', 'sbdvs2']),
                               mk('iowa', 90, ['gun16in_50', 'gun16in_50', 'ap_mk8'])];
        /* 先在账本里造出「常规阶首通」，解锁强敌阶入口 */
        Game.state.stats.historic['H1:firstClear'] = Date.now();
        var stH = Sortie.startHard('H1', 1);
        if (!stH.ok) { scr.innerHTML = '<pre style="color:#f88">' + stH.msg + '</pre>'; return; }
        Game.state.sortie.node = 'X';
        Game.state.sortie.wave = 2;                 // 第二波：横幅与敌军提示应切换
        SortieUI.sortieActive(scr);
        return;
      }
      if (c === 'histModal' || c === 'histResult') {
        /* 强敌阶二波制的「迎击 / 收兵」弹窗与收兵后的结算摘要（同步驱动：跳过演出 → 追击选择 → 二波选择） */
        Game.state.admiral.level = 60;
        Game.gain({ fuel: 99999, ammo: 99999, steel: 99999, baux: 99999 });
        Game.state.stats.historic['H1:firstClear'] = Date.now();
        var CVF = ['f6f5', 'f6f5', 'f6f5', 'f6f5'];
        Game.state.fleet[1] = [mk('enterprise', 110, CVF), mk('essex', 110, CVF), mk('saratoga', 110, CVF),
          mk('iowa', 110, ['gun16in_50', 'gun16in_50', 'ap_mk8', 'os2u']),
          mk('fletcher', 110, ['gun5in_38', 'torp_mk15', 'torp_mk15']),
          mk('baltimore', 110, ['gun8in_55', 'gun8in_55', 'radar_sg'])];
        localStorage.setItem('usnc_form_fixed', '单纵阵');
        var stHM = Sortie.startHard('H1', 1);
        if (!stHM.ok) { scr.innerHTML = '<pre style="color:#f88">' + stHM.msg + '</pre>'; return; }
        Game.state.sortie.node = 'X';
        SortieUI.sortieActive(scr);
        var adv = scr.querySelector('[data-act="advance"]');
        if (adv) adv.click();
        var sk = scr.querySelector('#fxSkip');
        if (sk) sk.click();
        var endB = document.querySelector('#modal-root [data-end]');
        if (endB) endB.click();
        if (c === 'histResult') {
          var retB = document.querySelector('#modal-root [data-retire]');
          if (retB) retB.click();
        }
        return;
      }
      if (c === 'brief52') {
        /* 5-2 苏里高海峡（V0.304 子批 3c）：全夜战路线 —— 简报点明夜战节点 ×3 + 威胁评估 */
        Game.state.mapProgress['5-1'].cleared = true;
        SortieUI.mapList(scr);
        var a5 = scr.querySelector('[data-area="5"]'); if (a5) a5.click();
        var m52 = scr.querySelector('[data-map="5-2"]'); if (m52) m52.click();
        return;
      }
      if (c === 'nodes55') {
        /* 5-5 莱特湾决战（V0.304 子批 3c）：四类特殊节点同图 + 重连后的双路线 */
        Game.state.mapProgress['5-4'].cleared = true;
        Game.state.mapProgress['5-5'].kills = 2; Game.state.mapProgress['5-5'].gauge = 6;
        var st55 = Sortie.start('5-5', 1);
        if (!st55.ok) { scr.innerHTML = '<pre style="color:#f88">' + st55.msg + '</pre>'; return; }
        Game.state.sortie.node = 'A';
        SortieUI.sortieActive(scr);
        return;
      }
      if (c === 'histM1' || c === 'histM2') {
        /* V0.304 第二批战役详情：
         *   histM1 —— M1 中途岛 + 含战列舰编成 → 禁入红色警示（考「禁入制空」）
         *   histM2 —— M2 莱特湾 + 混编编成 → 三组 require 全部满足 + 资源压力简报（坑 #25） */
        Game.state.admiral.level = 60;
        var histFleet2 = (c === 'histM1')
          ? [mk('enterprise', 95, ['f6f5', 'f6f5', 'f6f5', 'sbdvs2']),
             mk('essex', 90, ['f6f5', 'f6f5', 'tbf', 'sbdvs2']),
             mk('iowa', 90, ['gun16in_50', 'gun16in_50', 'ap_mk8']),
             mk('fletcher', 80, ['gun5in_38', 'torp_mk15', 'torp_mk15'])]
          : [mk('enterprise', 95, ['f6f5', 'f6f5', 'tbf', 'sbdvs2']),
             mk('iowa', 90, ['gun16in_50', 'gun16in_50', 'ap_mk8']),
             mk('fletcher', 85, ['gun5in_38', 'torp_mk15', 'torp_mk15']),
             mk('kidd', 80, ['gun5in_38', 'torp_mk15', 'radar_sg'])];
        Game.state.fleet[1] = histFleet2;
        SortieUI.mapList(scr);
        var tabH2 = scr.querySelector('[data-tab="hist"]'); if (tabH2) tabH2.click();
        var bSel = scr.querySelector('[data-battle="' + (c === 'histM1' ? 'M1' : 'M2') + '"]'); if (bSel) bSel.click();
        return;
      }
      if (c === 'histWaveM2') {
        /* V0.304 强敌阶第二波入场：M2 莱特湾，栗田主力压上，看第二波横幅 */
        Game.state.admiral.level = 60;
        Game.state.fleet[1] = [mk('enterprise', 95, ['f6f5', 'f6f5', 'tbf', 'sbdvs2']),
                               mk('iowa', 95, ['gun16in_50', 'gun16in_50', 'ap_mk8']),
                               mk('fletcher', 90, ['gun5in_38', 'torp_mk15', 'torp_mk15']),
                               mk('kidd', 90, ['gun5in_38', 'torp_mk15', 'radar_sg'])];
        Game.state.stats.historic['M2:firstClear'] = Date.now();
        var stM2 = Sortie.startHard('M2', 1);
        if (!stM2.ok) { scr.innerHTML = '<pre style="color:#f88">' + stM2.msg + '</pre>'; return; }
        Game.state.sortie.node = 'X';
        Game.state.sortie.wave = 2;
        SortieUI.sortieActive(scr);
        return;
      }
      if (c.indexOf('diff') === 0) {
        /* V0.306 批次1：海域难度档徽标人工核对页
         *   diffA1     —— 区域 1 列表 + 1-4 详情（T1，短提示）
         *   diffA3     —— 区域 3 列表 + 3-4 详情（T4，含引号与粗体的长句）
         *   diffA5     —— 区域 5 列表 + 5-5 详情（T5，全项目最长提示 → 验折行）
         *   diffActive —— 出击前页头徽标（3-5）
         * 用法：npm start 后打开 http://127.0.0.1:3000/_shot_air.html?case=diffA5 */
        Game.state.mapProgress['1-3'].cleared = true;
        Game.state.mapProgress['3-3'].cleared = true;
        Game.state.mapProgress['3-4'].cleared = true;
        Game.state.mapProgress['5-4'].cleared = true;
        if (c === 'diffActive') {
          var stD = Sortie.start('3-5', 1);
          if (!stD.ok) { scr.innerHTML = '<pre style="color:#f88">' + stD.msg + '</pre>'; return; }
          SortieUI.sortieActive(scr);
          return;
        }
        var areaD = c === 'diffA5' ? '5' : (c === 'diffA3' ? '3' : '1');
        var pickD = c === 'diffA5' ? '5-5' : (c === 'diffA3' ? '3-4' : '1-4');
        SortieUI.mapList(scr);
        var tabD = scr.querySelector('[data-area="' + areaD + '"]'); if (tabD) tabD.click();
        var mapD = scr.querySelector('[data-map="' + pickD + '"]'); if (mapD) mapD.click();
        return;
      }

      if (c.indexOf('sup') === 0) {
        /* V0.306 批次2：支援舰队人工核对页
         *   supSel（默认）—— 1-1 海域详情里的支援选择器：第 2 舰队可选、第 3 舰队「远征中」置灰 + 已选状态
         *   supT5         —— 5-5 决战图（T5 高装甲警告）
         *   supLog        —— 支援战报行（kind:'support' 事件 + 【结算归因】）
         * 用法：npm start 后打开 http://127.0.0.1:3000/_shot_air.html?case=supT5 */
        Game.unlockFleet(3);
        var mkSup = function (ids) {
          return ids.map(function (id) {
            var s = Game.createShip(id, 90);
            s.hp = Game.shipStats(s.uid).hpMax;
            s.supply = { fuel: 1, ammo: 1 }; s.morale = 96;
            Game.equipDefaults(s.uid);
            return s.uid;
          });
        };
        Game.state.fleet[2] = mkSup(['southdakota', 'indiana', 'baltimore']);
        Game.state.fleet[3] = mkSup(['atlanta', 'helena', 'fletcher']);
        Game.state.expeditions[3] = { exId: 'ex1', end: Date.now() + 12 * 60 * 1000 };
        if (c === 'supT5') {
          Game.state.mapProgress['5-4'].cleared = true;
          SortieUI.mapList(scr);
          var a5s = scr.querySelector('[data-area="5"]'); if (a5s) a5s.click();
          var m55 = scr.querySelector('[data-map="5-5"]'); if (m55) m55.click();
          var selT5 = scr.querySelector('[data-sup="2"]'); if (selT5) selT5.click();
          return;
        }
        if (c === 'supLog') {
          Game.state.mapProgress['1-1'].cleared = true;
          var stL = Sortie.start('1-1', 1, { supportFleet: 2 });
          if (!stL.ok) { scr.innerHTML = '<pre style="color:#f88">' + stL.msg + '</pre>'; return; }
          Game.state.sortie.node = 'A';                     // 1-1 A = 战斗点
          SortieUI.sortieActive(scr);
          var advL = scr.querySelector('[data-act="advance"]'); if (advL) advL.click();
          var fL = document.querySelector('#modal-root [data-f="单纵阵"]'); if (fL) fL.click();
          var skL = scr.querySelector('#fxSkip') || document.querySelector('#fxSkip'); if (skL) skL.click();
          return;
        }
        SortieUI.mapList(scr);
        var a1s = scr.querySelector('[data-area="1"]'); if (a1s) a1s.click();
        var m11 = scr.querySelector('[data-map="1-1"]'); if (m11) m11.click();
        var sel2 = scr.querySelector('[data-sup="2"]'); if (sel2) sel2.click();
        return;
      }

      var st = Sortie.start('2-3', 1);
      if (!st.ok) { scr.innerHTML = '<pre style="color:#f88">' + st.msg + '</pre>'; return; }
      Game.state.sortie.node = 'A';                      // 2-3 A = 航空战点
      SortieUI.sortieActive(scr);
    });
  </script>
</body>
</html>
